name: Publishing coverage

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: apis.json.example -> apis.json
        run: cp src/main/resources/apis.json.example src/main/resources/apis.json

      - name: Build & test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-coverage-badge: true
          generate-branches-badge: false
          coverage-badge-filename: jacoco.svg

      - name: Add badge to gh pages artifact
        run: cp .github/badges/jacoco.svg target/site/jacoco/jacoco.svg

      - name: Upload JaCoCo coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: error

  deploy:
    name: Deploy coverage to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Publish coverage to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/jacoco

      - name: Deploy coverage to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
